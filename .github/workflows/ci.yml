name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
      - run: flutter pub get
      - run: dart format
      - run: flutter analyze
      - run: flutter test
  build:
    runs-on: ubuntu-latest
    needs: [check]
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk